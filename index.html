main.page{position:relative;isolation:isolate}.page>*:not(.page-garden){position:relative;z-index:2}.page-garden{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.tear-toggle{position:fixed;right:15px;bottom:18px;z-index:140;width:58px;height:58px;padding:0;border:3px solid #111;border-radius:50%;background:#fff;box-shadow:4px 4px 0 #111;cursor:pointer;transform:rotate(-3deg)}body.intro-lock .tear-toggle{visibility:hidden}.tear-toggle:active{transform:translate(3px,3px) rotate(3deg) scale(.94);box-shadow:1px 1px 0 #111}.tear-icon{position:absolute;width:24px;height:31px;left:15px;top:10px;background:${accent};border:3px solid #111;border-radius:58% 45% 60% 35%;transform:rotate(45deg)}.tear-icon:after{content:"";position:absolute;width:7px;height:10px;border-radius:50%;background:#fff;left:5px;top:5px}.tear-toggle.pop .tear-icon{animation:tearPop .5s cubic-bezier(.2,.9,.3,1.3)}@keyframes tearPop{50%{transform:rotate(45deg) scale(1.28,.8)}}

html=html.replace('</body>',`<script>(()=>{const b=document.getElementById('tearToggle'),g=document.getElementById('pageGarden'),eye=document.querySelector('.hero .eye');if(!b||!g)return;let stage=0,busy=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function grow(){stage=Math.min(5,stage+1);g.dataset.stage=stage;if(stage===5){g.classList.remove('bloom');void g.offsetWidth;g.classList.add('bloom')}}function splash(x,y){const s=document.createElement('span');s.className='tear-splash';s.style.left=(x-39+scrollX)+'px';s.style.top=(y-10+scrollY)+'px';document.body.appendChild(s);s.style.animation='splashRing .55s ease-out forwards';setTimeout(()=>s.remove(),600)}function drop(){if(reduced||!eye){grow();busy=false;return}const a=eye.getBoundingClientRect(),p=g.querySelector('.pool').getBoundingClientRect(),sx=a.left+a.width/2-12,sy=a.bottom-8,tx=p.left+p.width/2-12,ty=p.top-16,t=document.createElement('span');t.className='falling-tear';t.style.left=(sx+scrollX)+'px';t.style.top=(sy+scrollY)+'px';document.body.appendChild(t);const dx=tx-sx,dy=ty-sy;t.animate([{transform:'translate(0,0) rotate(45deg) scale(.7)',opacity:0},{transform:'translate(0,8px) rotate(45deg)',opacity:1,offset:.12},{transform:'translate('+dx+'px,'+dy+'px) rotate(45deg)',opacity:1,offset:.82},{transform:'translate('+dx+'px,'+(dy+8)+'px) rotate(45deg) scale(1.3,.45)',opacity:0}],{duration:820,easing:'cubic-bezier(.25,.72,.3,1)',fill:'forwards'}).finished.then(()=>{t.remove();splash(p.left+p.width/2,p.top+8);grow();busy=false}).catch(()=>{t.remove();grow();busy=false})}b.addEventListener('click',()=>{b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(busy)return;if(stage>=5){g.classList.remove('bloom');void g.offsetWidth;g.classList.add('bloom');return}busy=true;drop()})})();<\/script></body>`);
