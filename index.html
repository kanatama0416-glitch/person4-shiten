html=html.replace('</style>',`
.v:nth-child(1){--eye-color:#ff4f87!important}.v:nth-child(2){--eye-color:#58c8ff!important}.v:nth-child(3){--eye-color:#ffd83d!important}.v:nth-child(4){--eye-color:#70dc8b!important}.v:nth-child(5){--eye-color:#9b7cff!important}.v:first-child b{color:#111!important}.v:nth-child(4) b{color:${accent}!important}.v:first-child:before{display:none!important}.v:nth-child(4):before{content:"NOW";position:absolute;z-index:6;top:-7px;right:-2px;background:#111;color:#fff;border-radius:99px;padding:1px 5px;font:900 7px Arial;letter-spacing:.08em;display:block!important}

</style>`);
html=html.replace('</body>',`<script>(()=>{
const b=document.getElementById('tearToggle'),g=document.getElementById('p4Garden'),svg=document.getElementById('p4GardenSvg'),eye=document.querySelector('.hero .eye'),pool=document.getElementById('p4Pool'),page=document.querySelector('main.page');if(!b||!g||!svg||!page)return;
let used=false,busy=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg';
const E=(name,attrs={})=>{const el=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el};
function leaf(x,y,rot,side,order){const wrap=E('g',{transform:'translate('+x+' '+y+') rotate('+rot+')'+(side==='r'?' scale(-1 1)':'')});const p=E('path',{d:'M -22 0 C -8 -18 13 -17 26 0 C 10 16 -10 17 -22 0 Z',class:'p4-leaf','data-order':order});wrap.appendChild(p);svg.appendChild(wrap)}
function flower(x,y,order){const q=E('g',{class:'p4-flower','data-order':order,transform:'translate('+x+' '+y+')'});[[0,-22],[19,-11],[19,11],[0,22],[-19,11],[-19,-11]].forEach(([px,py])=>q.appendChild(E('ellipse',{cx:px,cy:py,rx:12,ry:18,class:'petal'})));q.appendChild(E('ellipse',{cx:0,cy:0,rx:20,ry:13,class:'eye-white'}));q.appendChild(E('circle',{cx:0,cy:0,r:8,class:'iris'}));q.appendChild(E('circle',{cx:1,cy:1,r:3.5,class:'pupil'}));q.appendChild(E('circle',{cx:-3,cy:-3,r:2,class:'shine'}));svg.appendChild(q)}
function build(){while(svg.firstChild)svg.removeChild(svg.firstChild);const w=page.clientWidth,h=Math.max(page.scrollHeight,page.clientHeight),top=155;svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('preserveAspectRatio','none');svg.appendChild(E('path',{class:'p4-vine',pathLength:'1',d:'M 8 '+top+' C 36 '+(top+115)+', 5 '+(h*.27)+', 28 '+(h*.40)+' S 8 '+(h*.66)+', 30 '+(h-90)}));svg.appendChild(E('path',{class:'p4-vine',pathLength:'1',d:'M '+(w-8)+' '+top+' C '+(w-36)+' '+(top+115)+', '+(w-5)+' '+(h*.27)+', '+(w-28)+' '+(h*.40)+' S '+(w-8)+' '+(h*.66)+', '+(w-30)+' '+(h-90)}));const ys=[top+90,top+175,h*.31,h*.40,h*.50,h*.60,h*.70,h*.80,h*.88];ys.forEach((y,i)=>{const lx=20+(i%3)*12,rx=w-lx;leaf(lx,y,i%2?-26:18,'l',i);leaf(rx,y+22,i%2?26:-18,'r',i)});flower(48,h*.30,0);flower(w-48,h*.43,1);flower(54,h*.61,2);flower(w-54,h*.78,3);if(used)finishInstant()}
function finishInstant(){g.classList.add('grown');svg.querySelectorAll('.p4-vine').forEach(v=>v.style.strokeDashoffset='0');svg.querySelectorAll('.p4-leaf,.p4-flower').forEach(v=>v.classList.add('show'))}
function growAll(){g.classList.add('grown');svg.querySelectorAll('.p4-vine').forEach(v=>v.style.strokeDashoffset='0');const leaves=[...svg.querySelectorAll('.p4-leaf')];leaves.forEach((v,i)=>setTimeout(()=>v.classList.add('show'),220+i*65));const flowers=[...svg.querySelectorAll('.p4-flower')];flowers.forEach((v,i)=>setTimeout(()=>{v.classList.add('show');v.animate([{opacity:0},{opacity:1}],{duration:450,fill:'forwards'})},1150+i*120));b.disabled=true;b.setAttribute('aria-label','植物は育ちました')}
function splash(x,y){const s=document.createElement('span');s.className='tear-splash';s.style.left=(x-39+scrollX)+'px';s.style.top=(y-10+scrollY)+'px';document.body.appendChild(s);s.style.animation='splashRing .55s ease-out forwards';setTimeout(()=>s.remove(),600)}
function drop(){if(reduced||!eye){growAll();busy=false;return}const a=eye.getBoundingClientRect(),p=pool.getBoundingClientRect(),sx=a.left+a.width/2-12,sy=a.bottom-8,tx=p.left+p.width/2-12,ty=p.top-16,t=document.createElement('span');t.className='falling-tear';t.style.left=(sx+scrollX)+'px';t.style.top=(sy+scrollY)+'px';document.body.appendChild(t);const dx=tx-sx,dy=ty-sy;t.animate([{transform:'translate(0,0) rotate(45deg) scale(.7)',opacity:0},{transform:'translate(0,8px) rotate(45deg)',opacity:1,offset:.12},{transform:'translate('+dx+'px,'+dy+'px) rotate(45deg)',opacity:1,offset:.82},{transform:'translate('+dx+'px,'+(dy+8)+'px) rotate(45deg) scale(1.3,.45)',opacity:0}],{duration:820,easing:'cubic-bezier(.25,.72,.3,1)',fill:'forwards'}).finished.then(()=>{t.remove();splash(p.left+p.width/2,p.top+8);growAll();busy=false}).catch(()=>{t.remove();growAll();busy=false})}
