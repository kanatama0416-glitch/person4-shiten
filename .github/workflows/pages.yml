name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and stage static page
        run: |
          node scripts/check-static.mjs
          mkdir -p _site
          cp index.html p4-garden.js p4-hints.js _site/
          # 03 still prefetches core.html. Keep a complete static compatibility
          # copy, without loading or executing the obsolete HTML generator.
          cp index.html _site/core.html
          cp -r checks _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
