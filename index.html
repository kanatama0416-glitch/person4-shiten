<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>視展 — 04</title>
<style>
html,body{margin:0;min-height:100%;background:#000;color:#fff}
#p4Preboot{position:fixed;inset:0;z-index:99999;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#p4Preboot .intro-eye-wrap{position:absolute;left:50%;top:50%;width:150px;height:90px;margin-left:-75px;margin-top:-78px}
#p4Preboot .intro-eye{width:150px;height:90px;border:4px solid #111;border-radius:50%;background:#fff;position:relative;overflow:hidden;transform:rotate(-3deg);box-sizing:border-box}
#p4Preboot .intro-iris{position:absolute;width:54px;height:54px;border-radius:50%;background:#70dc8b;border:4px solid #111;top:14px;left:45px;box-sizing:border-box}
#p4Preboot .intro-iris:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#111;top:13px;left:13px;box-shadow:7px -7px 0 -5px #fff}
#p4Preboot .intro-rays{position:absolute;left:50%;top:-47px;width:120px;height:34px;transform:translateX(-50%)}
#p4Preboot .intro-rays i{position:absolute;bottom:0;width:7px;height:30px;background:#fff;border-radius:99px}
#p4Preboot .intro-rays i:nth-child(1){left:15px;transform:rotate(-35deg)}
#p4Preboot .intro-rays i:nth-child(2){left:56px;height:34px}
#p4Preboot .intro-rays i:nth-child(3){right:15px;transform:rotate(35deg)}
#p4Preboot .intro-brand{position:absolute;top:116px;left:50%;transform:translateX(-50%);color:#fff;text-align:center;white-space:nowrap}
#p4Preboot .intro-title{display:block;font-weight:900;font-size:52px;letter-spacing:.08em;line-height:1}
#p4Preboot .intro-subtitle{display:block;margin-top:10px;font:600 13px/1 Arial,sans-serif;letter-spacing:.55em;padding-left:.55em}
@media(max-width:380px){#p4Preboot .intro-title{font-size:48px}}
</style>
<link rel="preload" href="./core.html" as="fetch" crossorigin="anonymous">
<link rel="preload" href="https://kanatama0416-glitch.github.io/person1-shiten/base.html" as="fetch" crossorigin="anonymous">
</head>
<body>
<div id="p4Preboot" aria-hidden="true"><div class="intro-eye-wrap"><div class="intro-rays"><i></i><i></i><i></i></div><div class="intro-eye"><div class="intro-iris"></div></div><div class="intro-brand"><span class="intro-title">視展</span><span class="intro-subtitle">SHITEN</span></div></div></div>
<script>
(async()=>{
  try{
    const [coreRes,baseRes]=await Promise.all([
      fetch('./core.html',{cache:'force-cache'}),
      fetch('https://kanatama0416-glitch.github.io/person1-shiten/base.html',{cache:'force-cache'})
    ]);
    if(!coreRes.ok)throw new Error('core '+coreRes.status);
    if(!baseRes.ok)throw new Error('base '+baseRes.status);
    let source=await coreRes.text();
    const baseHtml=await baseRes.text();
    const bytes=new TextEncoder().encode(baseHtml);
    let binary='';
    for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
    const base64=btoa(binary);
    const fetchPattern=/let html=await\(await fetch\([^;]+?\)\)\.text\(\);/;
    if(!fetchPattern.test(source))throw new Error('base fetch marker not found');
    source=source.replace(fetchPattern,`let html=new TextDecoder().decode(Uint8Array.from(atob('${base64}'),c=>c.charCodeAt(0)));`);
    source=source.replaceAll("cache:'no-store'","cache:'force-cache'");
    source=source.replace('body{visibility:hidden}','body{visibility:visible}');
    source=source.replace('const w=page.clientWidth,h=Math.max(page.scrollHeight,page.clientHeight),top=165,c=w/2,groundY=hr.bottom-pr.top+50;','const pageTop=page.getBoundingClientRect().top+scrollY,w=page.clientWidth,h=Math.max(page.scrollHeight,page.clientHeight,document.documentElement.scrollHeight-pageTop),top=165,c=w/2,groundY=hr.bottom-pr.top+50;');
    source=source.replace(',1430,65);',',1430,120);')
      .replace(',2040,125);',',2040,300);')
      .replace('trunk.start+trunk.duration,62);','trunk.start+trunk.duration,120);')
      .replaceAll(',forkTime,145);',',forkTime,320);')
      .replaceAll(',820,true)',',2000,true)');
    const styleMarker="html=html.replace('<style>'";
    const timingPatch="html=html.replace('},1050);introEye.animate','},250);introEye.animate').replaceAll('duration:1650,delay:1250','duration:650,delay:250').replace('duration:1450,delay:1500','duration:600,delay:300').replace('},2980)','},1050)');";
    if(!source.includes(styleMarker))throw new Error('intro timing marker not found');
    source=source.replace(styleMarker,timingPatch+styleMarker);
    const pattern=/document\.open\(\);document\.write\(html\);document\.close\(\);?/;
    if(!pattern.test(source))throw new Error('patch marker not found');
    const hook=`html=html.replace('</body>','<script>document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)},true);<\\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/eye-attract.js?v=20260916-stable"><\\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/tease-overrides.js?v=42d0b943"><\\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/eye-toggle-off.js?v=fb86c186"><\\/script><script src="https://kanatama0416-glitch.github.io/person4-shiten/p4-stability.js?v=20260916-2"><\\/script></body>');`;
    source=source.replace(pattern,m=>hook+m);
    document.open();document.write(source);document.close();
  }catch(e){
    console.error(e);
    document.body.style.background='#f4f4f1';
    document.body.style.color='#111';
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
