html=html.replace('</style>',`
.v:nth-child(1){--eye-color:#ff4f87!important}.v:nth-child(2){--eye-color:#58c8ff!important}.v:nth-child(3){--eye-color:#ffd83d!important}.v:nth-child(4){--eye-color:#70dc8b!important}.v:nth-child(5){--eye-color:#9b7cff!important}.v:first-child b{color:#111!important}.v:nth-child(4) b{color:${accent}!important}.v:first-child:before{display:none!important}.v:nth-child(4):before{content:"NOW";position:absolute;z-index:6;top:-7px;right:-2px;background:#111;color:#fff;border-radius:99px;padding:1px 5px;font:900 7px Arial;letter-spacing:.08em;display:block!important}

</style>`);
html=html.replace('</body>',`<script>(()=>{
const b=document.getElementById('tearToggle'),g=document.getElementById('p4Garden'),svg=document.getElementById('p4GardenSvg'),eye=document.querySelector('.hero .eye'),pool=document.getElementById('p4Pool'),page=document.querySelector('main.page');if(!b||!g||!svg||!page)return;
let stage=0,busy=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg';
const E=(name,attrs={})=>{const el=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el};
function leaf(x,y,rot,step,side){const p=E('path',{d:'M -20 0 C -7 -17 12 -16 24 0 C 9 15 -9 16 -20 0 Z',class:'p4-leaf','data-step':step,transform:'translate('+x+' '+y+') rotate('+rot+')'+(side==='r'?' scale(-1 1)':'')});svg.appendChild(p)}
function flower(x,y,step){const q=E('g',{class:'p4-flower','data-step':step,transform:'translate('+x+' '+y+')'});[[0,-22],[19,-11],[19,11],[0,22],[-19,11],[-19,-11]].forEach(([px,py])=>q.appendChild(E('ellipse',{cx:px,cy:py,rx:12,ry:18,class:'petal'})));q.appendChild(E('ellipse',{cx:0,cy:0,rx:20,ry:13,class:'eye-white'}));q.appendChild(E('circle',{cx:0,cy:0,r:8,class:'iris'}));q.appendChild(E('circle',{cx:1,cy:1,r:3.5,class:'pupil'}));q.appendChild(E('circle',{cx:-3,cy:-3,r:2,class:'shine'}));svg.appendChild(q)}
function build(){while(svg.firstChild)svg.removeChild(svg.firstChild);const w=page.clientWidth,h=Math.max(page.scrollHeight,page.clientHeight),top=155;svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('preserveAspectRatio','none');const left=E('path',{class:'p4-vine',pathLength:'1',d:'M 8 '+top+' C 34 '+(top+120)+', 5 '+(h*.28)+', 28 '+(h*.40)+' S 8 '+(h*.66)+', 30 '+(h-90)});const right=E('path',{class:'p4-vine',pathLength:'1',d:'M '+(w-8)+' '+top+' C '+(w-34)+' '+(top+120)+', '+(w-5)+' '+(h*.28)+', '+(w-28)+' '+(h*.40)+' S '+(w-8)+' '+(h*.66)+', '+(w-30)+' '+(h-90)});svg.append(left,right);
const ys=[top+95,top+190,h*.33,h*.46,h*.59,h*.72,h*.84];ys.forEach((y,i)=>{const step=Math.min(4,1+Math.floor(i/2));const lx=20+(i%2)*18,rx=w-lx;leaf(lx,y,i%2?-22:18,step,'l');leaf(rx,y+24,i%2?22:-18,step,'r')});flower(48,h*.30,5);flower(w-48,h*.43,5);flower(55,h*.62,5);flower(w-55,h*.78,5);applyStage()}
function applyStage(){g.dataset.stage=String(stage);const progress=[0,.20,.40,.62,.82,1][stage];svg.querySelectorAll('.p4-vine').forEach(v=>v.style.strokeDashoffset=String(1-progress));svg.querySelectorAll('.p4-leaf').forEach(v=>{const on=Number(v.dataset.step)<=stage;v.style.opacity=on?'1':'0';v.style.transform=on?'scale(1)':'scale(.2)'});svg.querySelectorAll('.p4-flower').forEach(v=>{const on=stage>=5;v.style.opacity=on?'1':'0';v.style.transform=on?'scale(1)':'scale(.2)'});if(stage===5){svg.querySelectorAll('.p4-flower').forEach((v,i)=>v.animate([{transform:'scale(.3) rotate(-8deg)'},{transform:'scale(1.15) rotate(4deg)',offset:.65},{transform:'scale(1) rotate(0)'}],{duration:650,delay:i*70,easing:'cubic-bezier(.2,.9,.3,1.25)'}))}}

function drop(){if(reduced||!eye){grow();busy=false;return}const a=eye.getBoundingClientRect(),p=pool.getBoundingClientRect(),sx=a.left+a.width/2-12,sy=a.bottom-8,tx=p.left+p.width/2-12,ty=p.top-16,t=document.createElement('span');t.className='falling-tear';t.style.left=(sx+scrollX)+'px';t.style.top=(sy+scrollY)+'px';document.body.appendChild(t);const dx=tx-sx,dy=ty-sy;t.animate([{transform:'translate(0,0) rotate(45deg) scale(.7)',opacity:0},{transform:'translate(0,8px) rotate(45deg)',opacity:1,offset:.12},{transform:'translate('+dx+'px,'+dy+'px) rotate(45deg)',opacity:1,offset:.82},{transform:'translate('+dx+'px,'+(dy+8)+'px) rotate(45deg) scale(1.3,.45)',opacity:0}],{duration:820,easing:'cubic-bezier(.25,.72,.3,1)',fill:'forwards'}).finished.then(()=>{t.remove();splash(p.left+p.width/2,p.top+8);grow();busy=false}).catch(()=>{t.remove();grow();busy=false})}

}catch(e){document.body.style.visibility='visible';document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>'}
